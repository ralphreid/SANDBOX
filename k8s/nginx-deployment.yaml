apiVersion: v1
metadata:
  namespace: my-namespace
kind: ConfigMap
metadata:
  name: localstack-config
data:
  LOCALSTACK_HOST: "localstack"
  LOCALSTACK_PORT: "4566"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
