apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.23.0
          volumeMounts:
            - name: config-volume
              mountPath: /etc/alertmanager
              subPath: alertmanager.yml
      volumes:
        - name: config-volume
          configMap:
            name: alertmanager-config
