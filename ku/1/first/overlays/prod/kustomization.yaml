apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set the namespace for the resources
namespace: clearml-prod

# Use the base Helm chart
resources:
  - ../charts/clearml/values-prod.yaml

# Configure the common resources (e.g., shared ConfigMaps or Secrets)
commonLabels:
  environment: prod
  app: clearml

# Configure Helm chart overrides
# patches:
#   - patch-clearml-prod.yaml

# Additional prod-specific configurations
configMapGenerator:
  - name: clearml-prod-config
    literals:
      - DEBUG=false

# HelmChartInflationGenerator allows Kustomize to use Helm charts
helmCharts:
  - name: clearml
    releaseName: clearml
    version: 1.0.0
    repo: file://../../charts/clearml
    valuesFile: values-prod.yaml
