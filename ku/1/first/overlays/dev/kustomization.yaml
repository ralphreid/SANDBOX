apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set the namespace for the resources
namespace: clearml-dev

# Use the base Helm chart
# resources:
#   - ../../charts/clearml/values-dev.yaml

# Configure the common resources (e.g., shared ConfigMaps or Secrets)
commonLabels:
  environment: dev
  app: clearml

# Configure Helm chart overrides
# patches:
#   - patch-clearml-dev.yaml

# Additional dev-specific configurations
configMapGenerator:
  - name: clearml-dev-config
    literals:
      - DEBUG=true

# HelmChartInflationGenerator allows Kustomize to use Helm charts
helmCharts:
  - name: clearml
    releaseName: clearml
    version: 1.0.0
    repo: file://../../charts/clearml
    valuesFile: values-dev.yaml
