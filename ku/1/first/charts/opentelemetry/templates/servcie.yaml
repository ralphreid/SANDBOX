apiVersion: v1
kind: Service
metadata:
  name: { { include "opentelemetry.fullname" . } }
  labels:
    app: { { include "opentelemetry.name" . } }
spec:
  type: { { .Values.service.type } }
  ports:
    - port: 55680
      targetPort: 55680
      protocol: TCP
    - port: 55681
      targetPort: 55681
      protocol: TCP
  selector:
    app: { { include "opentelemetry.name" . } }
