apiVersion: v1
kind: Service
metadata:
  name: { { include "grafana.fullname" . } }
  labels: { { - include "grafana.commonLabels" . | nindent 4 } }
spec:
  type: { { .Values.service.type | default "ClusterIP" } }
  ports:
    - port: { { .Values.service.port | default 80 } }
      targetPort: 3000
  selector: { { - include "grafana.selectorLabels" . | nindent 4 } }
