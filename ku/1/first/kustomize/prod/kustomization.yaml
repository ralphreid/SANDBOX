apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../charts/clearml
  - ../../charts/grafana
  - ../../charts/my-app
  - ../../charts/opentelemetry

helmCharts:
  - name: clearml
    chart: ../../charts/clearml
    valuesFile: ../../charts/clearml/values-prod.yaml
  - name: grafana
    chart: ../../charts/grafana
    valuesFile: ../../charts/grafana/values.yaml
  - name: my-app
    chart: ../../charts/my-app
    valuesFile: ../../charts/my-app/values-prod.yaml
  - name: opentelemetry
    chart: ../../charts/opentelemetry
    valuesFile: ../../charts/opentelemetry/values.yaml
